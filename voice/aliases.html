<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gizi · Zene becenevek</title><style>body{font:18px system-ui;max-width:540px;margin:30px auto;padding:20px;background:#171827;color:white}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit;border-radius:10px}button{background:#b9e994}li{margin:15px 0}label{display:block}#status{white-space:pre-wrap}</style><h1>Gizi · Zene becenevek</h1><p>A becenévhez add meg a Spotify dal linkjét. Csak pontos dalazonosító menthető.</p><form id="form"><label>Párosítási kulcs<input id="key" type="password" required autocomplete="off"></label><label>Becenév<input id="phrase" placeholder="sárga fejű bácsi" required maxlength="100"></label><label>Ragozott alak (opcionális)<input id="inflection" placeholder="sárga fejű bácsit" maxlength="100"></label><label>Spotify dal linkje<input id="track" placeholder="https://open.spotify.com/track/…" required></label><button>Hozzáadás</button></form><p id="status" role="status"></p><button id="load">Meglévő becenevek</button><ul id="list"></ul><script>
const $=id=>document.getElementById(id);
const fragment=new URLSearchParams(location.hash.slice(1));$('key').value=fragment.get('gizi-key')||'';if(location.hash)history.replaceState(null,'',location.pathname);
async function api(method,body){const r=await fetch('/gizi/metadata',{method,headers:{Authorization:'Bearer '+$('key').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){let e;try{e=await r.json()}catch{}throw Error(e?.error||'Hozzáférés vagy szolgáltatás hiba.')}return r.json()}
$('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('status').textContent='Mentés…';try{const x=await api('POST',{phrase:$('phrase').value,inflection:$('inflection').value,track:$('track').value});$('status').textContent='Mentve: '+x.aliases.join(' / ')+' → '+x.artists.join(', ')+' — '+x.title}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
$('load').onclick=async()=>{try{const x=await api('GET');$('list').replaceChildren();for(const e of x.entries){const li=document.createElement('li');li.textContent=e.aliases.join(' / ')+' → '+e.title;$('list').append(li)}}catch(e){$('status').textContent=e.message}};
</script></html>
